    <!-- Canonical URL -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="language" content="English" />

    <meta name="audience" content="all" />
    <meta name="application-name" content="Kourier Boyz" />
    
    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Kourier Boyz",
      "alternateName": "Kourier Boyz Marketplace and Courier Services",
      "url": "",
      "logo": "/brand/kourier-boyz-logo.png",
      "description": "Kourier Boyz connects an online marketplace with courier booking, rate comparison, pickup, and shipment tracking.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Service",
        "availableLanguage": ["English", "Hindi"]
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Kourier Boyz",
      "url": "",
      "description": "Marketplace shopping and courier services in one platform",
      "publisher": {
        "@type": "Organization",
        "name": "Kourier Boyz"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Store",
      "name": "Kourier Boyz",
      "image": "/brand/kourier-boyz-logo.png",
      "description": "Online marketplace connected to Kourier Boyz shipping services",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN"
      },
      "priceRange": "$$",
      "currenciesAccepted": "INR",
      "paymentAccepted": "Credit Card, Debit Card, UPI, Cash on Delivery"
    }
    </script>
    
    <!-- Category ItemList will be dynamically generated from API data -->
    <script type="application/ld+json" data-structured-data="static-categories" id="static-category-schema">
    {
      "@context": "https://schema.org",
      "@type": "ItemList",
      "name": "Product Categories",
      "description": "Browse marketplace categories available through Kourier Boyz"
    }
    </script>
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- DNS Prefetch for common domains -->
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
