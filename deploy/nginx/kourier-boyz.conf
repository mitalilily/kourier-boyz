map $http_upgrade $kourier_boyz_connection_upgrade {
    default upgrade;
    '' close;
}

upstream kourier_boyz_api {
    server 127.0.0.1:4100;
    keepalive 32;
}

upstream kourier_boyz_web {
    server 127.0.0.1:4170;
    keepalive 8;
}

upstream kourier_boyz_seller {
    server 127.0.0.1:4171;
    keepalive 8;
}

upstream kourier_boyz_admin {
    server 127.0.0.1:4172;
    keepalive 8;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://kourier_boyz_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kourier_boyz_connection_upgrade;
        proxy_read_timeout 210s;
    }

    location /socket.io/ {
        proxy_pass http://kourier_boyz_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kourier_boyz_connection_upgrade;
    }

    location / {
        proxy_pass http://kourier_boyz_web;
        include proxy_params;
        proxy_http_version 1.1;
    }
}

