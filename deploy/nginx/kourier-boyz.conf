server {
    listen 80;
    listen [::]:80;
    server_name kourierboyz.com www.kourierboyz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kourierboyz.com www.kourierboyz.com;

    client_max_body_size 20m;
    ssl_certificate /etc/letsencrypt/live/kourierboyz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kourierboyz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://kourier_boyz_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kourier_boyz_connection_upgrade;
        proxy_read_timeout 210s;
    }

    location /socket.io/ {
        proxy_pass http://kourier_boyz_api;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kourier_boyz_connection_upgrade;
    }

    location / {
        proxy_pass http://kourier_boyz_web;
        include proxy_params;
        proxy_http_version 1.1;
    }
}

